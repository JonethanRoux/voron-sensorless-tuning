#####################################################################
#   Sensorless homing - X / Y (TMC5160 StallGuard2)
#####################################################################
##  PREREQUISITES - this will crash the toolhead into the frame if these
##  are not true:
##    1. The DIAG jumper for MOTOR_1 (B/stepper_x) and MOTOR_2 (A/stepper_y)
##       must be fitted on the Kraken, so the driver DIAG line reaches
##       PC15 / PF0.
##    2. The physical X and Y endstop switches must be UNPLUGGED. They sit
##       on the same PC15 / PF0 pins and will fight the DIAG signal.
##    3. driver_SGT must be tuned (see the block at the bottom of this file).
##
##  StallGuard2 needs spreadCycle, so stealthchop_threshold must stay 0
##  on both drivers - it already is.

[gcode_macro _SENSORLESS_VARS]
description: Tuning knobs for sensorless homing
##  Current used *while homing*.
##  Too LOW is the failure mode that bites first: if the motors cannot drag the
##  gantry they skip steps, the axis crawls and drifts diagonally on CoreXY, and
##  StallGuard2 never sees a steady velocity so it produces no usable reading at
##  all - you get "No trigger after full movement" no matter what SGT is set to.
##  Too HIGH just means the frame takes more of a hit when it does stall.
##  SGT is tuned AT this current - change one and you must re-tune the other.
##  0 = DO NOT touch the currents: home at whatever run_current and
##  hold_current the config already sets. Any other value overrides them for the
##  homing move only. Left at 0.800 here because X's threshold was calibrated at
##  that current - SGT is only meaningful at the current it was tuned at, so
##  changing this silently re-tunes the axis.
##  0 = home at the configured run/hold current. Set 2026-08-27 so X is
##  calibrated at the currents printer.cfg actually uses (run 1.2 / hold 1.41)
##  rather than the old 0.800 override. SGT is only valid at the current it was
##  tuned at, so the previous sgt=1 for X is now void and must be re-swept.
variable_home_current: 1.000
##  Homing current for Y ONLY. 0 = fall back to home_current above.
##  Y drags the entire gantry; X moves only the toolhead. At a current that
##  suits X, the heavier Y axis tends to SKIP steps rather than stall cleanly,
##  and a skid produces a soft, gradual load that StallGuard cannot pick out
##  from acceleration - which is exactly the "no threshold works" signature.
##  This is deliberately separate so raising it cannot disturb X, whose SGT is
##  already calibrated at home_current and must not be re-tuned.
variable_y_home_current: 0
##  How far to back off the rail after a successful home, in mm.
variable_backoff: 10
##  How far to nudge the axis AWAY from the rail BEFORE homing, in mm.
##  Stops a toolhead already resting against the stop from tripping
##  StallGuard the instant homing begins.
variable_unload_dist: 15
##  Hold current DURING the homing move. 0 = match home_current, which is what
##  Klipper's TMC_Drivers.md wants for sensorless: if hold is LOWER than run,
##  then once the carriage is pressed against the rail the current drops while
##  it sits there and the carriage can shift, corrupting the home.
##  Set a real value only if you have a specific reason.
##  Hold current DURING the homing move only, restored afterwards.
##  This applies even when home_current is 0 (i.e. when homing at the configured
##  run current), which is what lets hold_current stay LOW for idle - where a
##  current at the RMS ceiling just makes heat - while still holding firmly at
##  the moment it matters. Klipper's TMC_Drivers.md wants hold == run for
##  sensorless: once the carriage is pressed against the rail, a lower hold lets
##  it shift and corrupts the origin.
##  0 = match whatever run current the homing move is using.
variable_home_hold_current: 0
##  Acceleration used for the Y homing move only, 0 disables the override.
##  Y drags the whole gantry, so at the printing accel its acceleration-phase
##  load sits close to its stall load and StallGuard cannot tell them apart -
##  which is why Y had no usable threshold at all: sgt=0 tripped during accel
##  at 1.8mm, sgt=1 never tripped and ground the rail. Accelerating gently for
##  the homing move drops the accel load well below the stall load and opens a
##  window between them. X is unaffected: this applies to the Y move only.
variable_y_home_accel: 1000
##  Same thing for X, 0 = leave the printing accel alone. X moves only the
##  toolhead, so it has never needed one - but TUNE_X_MATRIX sets this variable
##  by name, and calibrating X at Y's parameters means matching accel too.
variable_x_home_accel: 1000
##  NOTE: a temperature-compensated threshold table was tried here and removed.
##  StallGuard drifts with motor temperature, but the right fix is not to
##  compensate for it - it is to HOME COLD. START_PRINT now starts the bed with
##  M140 (non-blocking) and runs G28 before the chamber warms up, so sensorless
##  X/Y never runs hot. Only Z is re-homed after the soak, and Z uses the Tap
##  probe, which is temperature-independent.
gcode:
    RESPOND MSG="sensorless: home_current={printer['gcode_macro _SENSORLESS_VARS'].home_current} backoff={printer['gcode_macro _SENSORLESS_VARS'].backoff}"


[gcode_macro _SENSORLESS_HOME]
description: Helper - home one CoreXY axis on StallGuard at reduced current
gcode:
    {% set axis = params.AXIS|upper %}
    {% set v  = printer['gcode_macro _SENSORLESS_VARS'] %}
    ##  Inline conditional, not {% if %}: a {% set %} inside an if-block does not
    ##  escape that block in Jinja2, so the value would silently revert.
    {% set yhc = v.y_home_current|float %}
    {% set hc = (yhc if (params.AXIS|upper == 'Y' and yhc > 0) else v.home_current)|float %}
    {% set bo = v.backoff|float %}
    ##  Read the LIVE currents, not printer.configfile. configfile holds what the
    ##  file says at boot, so restoring from it silently throws away any runtime
    ##  SET_XY_CURRENT the moment you next home. printer['tmc5160 stepper_x'] is
    ##  the value actually in the driver right now.
    ##  What to restore to when homing finishes.
    ##
    ##  LIVE values are read, so a deliberate runtime SET_XY_CURRENT survives a
    ##  home instead of being reverted to whatever the file says.
    ##
    ##  But a live value that already EQUALS the homing current is not a
    ##  deliberate setting - it is the leftover of a homing run that was aborted
    ##  before it could restore (an e-stop, a killed script, a shutdown). Taking
    ##  it at face value makes the reduced current permanent, and every later
    ##  home re-confirms it, so the axis quietly prints at homing current
    ##  forever. That is exactly what happened here: run sat at 1.02 for hours
    ##  while the config said 1.2.
    ##
    ##  So: if live looks like the homing current, distrust it and use the
    ##  configured value. The tolerance covers TMC quantisation - the driver can
    ##  only produce discrete steps, so a requested 1.000 reads back as 1.020.
    {% set cfgs = printer.configfile.settings %}
    {% set lrx = printer['tmc5160 stepper_x'].run_current|float %}
    {% set lry = printer['tmc5160 stepper_y'].run_current|float %}
    {% set lhx = printer['tmc5160 stepper_x'].hold_current|float %}
    {% set lhy = printer['tmc5160 stepper_y'].hold_current|float %}
    {% set stuck_x = hc > 0 and (lrx - hc)|abs < 0.06 %}
    {% set stuck_y = hc > 0 and (lry - hc)|abs < 0.06 %}
    {% set run_x = cfgs['tmc5160 stepper_x'].run_current|float if stuck_x else lrx %}
    {% set run_y = cfgs['tmc5160 stepper_y'].run_current|float if stuck_y else lry %}
    {% set hold_x = cfgs['tmc5160 stepper_x'].hold_current|float if stuck_x else lhx %}
    {% set hold_y = cfgs['tmc5160 stepper_y'].hold_current|float if stuck_y else lhy %}
    {% if stuck_x or stuck_y %}
        RESPOND TYPE=error MSG="currents were still at the homing value from an aborted home - restoring from config, not from live"
    {% endif %}

    ##  On CoreXY both motors turn for any XY move, so both currents must drop.
    ##  HOLDCURRENT is passed EXPLICITLY: without it Klipper keeps whatever hold
    ##  was last requested, so an explicit hold set for printing would still be
    ##  in force during homing - mismatched against the reduced run current.
    {% set hh_cfg = printer['gcode_macro _SENSORLESS_VARS'].home_hold_current|float %}
    ##  Effective run current per motor: the override if one is set, otherwise
    ##  whatever that driver is already configured for.
    {% set eff_run_x = hc if hc > 0 else run_x %}
    {% set eff_run_y = hc if hc > 0 else run_y %}
    ##  Effective hold: the homing hold if one is set, otherwise match run.
    {% set eff_hold_x = hh_cfg if hh_cfg > 0 else eff_run_x %}
    {% set eff_hold_y = hh_cfg if hh_cfg > 0 else eff_run_y %}
    ##  Touch the drivers only if this actually changes something. With no
    ##  override and no homing hold, the configured currents are already right.
    {% set touch = (hc > 0) or (hh_cfg > 0) %}
    {% if touch %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={eff_run_x} HOLDCURRENT={eff_hold_x}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={eff_run_y} HOLDCURRENT={eff_hold_y}
    {% endif %}

    ##  StallGuard reads a moving motor as a stall. Let everything settle or the
    ##  axis will "home" instantly against nothing.
    ##  Back off the rail before homing, but ONLY when we already know where we
    ##  are. A blind FORCE_MOVE here (which is what this used to do) drives the
    ##  toolhead into the FAR end of the axis whenever it happens to be sitting
    ##  there - it has no position awareness and G1 limits do not apply to it.
    ##
    ##  When the axis is unhomed we simply skip it: homing from a cold start
    ##  works without the nudge. When it IS homed we can use G1, which respects
    ##  the axis limits, and only move if we are actually near the rail.
    {% set unload = printer['gcode_macro _SENSORLESS_VARS'].unload_dist|float %}
    {% set ax = axis|lower %}
    {% if unload > 0 and ax in printer.toolhead.homed_axes %}
        {% set pos  = printer.toolhead.position[0 if axis == 'X' else 1]|float %}
        {% set amax = printer.configfile.settings['stepper_' ~ ax].position_max|float %}
        {% if (amax - pos) < unload %}
            G91
            G1 {axis}-{unload} F1800
            G90
        {% endif %}
    {% endif %}

    M400
    G4 P2000

    ##  max_accel is read at RENDER time, which is before this macro has changed
    ##  anything, so it captures the true pre-homing value to restore.
    {% set yacc = (v.y_home_accel if axis == 'Y' else v.x_home_accel)|float %}
    {% set prev_acc = printer.toolhead.max_accel|float %}
    {% if yacc > 0 %}
        SET_VELOCITY_LIMIT ACCEL={yacc}
    {% endif %}

    G28 {axis}

    {% if yacc > 0 %}
        SET_VELOCITY_LIMIT ACCEL={prev_acc}
    {% endif %}

    ##  Back off the rail so the next home does not start already stalled.
    G91
    G1 {axis}-{bo} F1800
    G90
    M400
    G4 P2000

    ##  Restore exactly what was live before we touched anything.
    ##  Restoring is only meaningful if we overrode anything. With hc = 0 the
    ##  drivers were never touched, so writing values back would be inventing a
    ##  change - and would clobber a runtime SET_XY_CURRENT made since.
    {% if touch %}
        SET_TMC_CURRENT STEPPER=stepper_x CURRENT={run_x} HOLDCURRENT={hold_x}
        SET_TMC_CURRENT STEPPER=stepper_y CURRENT={run_y} HOLDCURRENT={hold_y}
        RESPOND MSG="homing done - restored run {run_x|round(2)}A hold {hold_x|round(2)}A (homed at run {eff_run_x|round(2)}A hold {eff_hold_x|round(2)}A)"
    {% else %}
        RESPOND MSG="homing done - currents untouched, homed at the configured run {run_x|round(2)}A hold {hold_x|round(2)}A"
    {% endif %}


[homing_override]
axes: xyz
##  Lets us lift Z before anything is homed.
set_position_z: 0
gcode:
    {% set hx = 'X' in params %}
    {% set hy = 'Y' in params %}
    {% set hz = 'Z' in params %}
    {% set do_all = not (hx or hy or hz) %}

    G90
    ##  Lift Z ONLY if Z is not already homed.
    ##  set_position_z: 0 fakes Z=0 on EVERY invocation of this override, so an
    ##  unconditional lift raises the gantry another 10mm on every single G28 X
    ##  or G28 Y - it climbs without bound. Nine tuning runs = 90mm of creep.
    {% if 'z' not in printer.toolhead.homed_axes %}
        G1 Z10 F1200
    {% endif %}

    {% if do_all or hx %}
        _SENSORLESS_HOME AXIS=X
    {% endif %}

    {% if do_all or hy %}
        _SENSORLESS_HOME AXIS=Y
    {% endif %}

    {% if do_all or hz %}
        ##  Guard only the "G28 Z on its own" case. On a bare G28 we homed X and Y
        ##  a few lines up, but this whole block is rendered to text BEFORE any of
        ##  it executes, so printer.toolhead.homed_axes still shows the state from
        ##  before the macro started. Checking it on do_all would always fail.
        {% if hz and not do_all %}
            {% if 'x' not in printer.toolhead.homed_axes or 'y' not in printer.toolhead.homed_axes %}
                { action_raise_error("Home X and Y before Z - Tap probes at bed centre.") }
            {% endif %}
        {% endif %}
        G90
        G1 X{printer.toolhead.axis_maximum.x / 2} Y{printer.toolhead.axis_maximum.y / 2} F6000
        M400
        G28 Z
        G1 Z10 F1200
    {% endif %}


#####################################################################
#   Tuning driver_SGT
#####################################################################
##  TMC5160 uses StallGuard2. Range is -64 to 63, and LOWER = MORE SENSITIVE.
##  It is set to 0 in printer.cfg, which is on the sensitive side ON PURPOSE:
##  a too-sensitive setting stops early and harms nothing, a too-insensitive
##  one drives the toolhead into the frame.
##
##  Procedure, with a hand on the emergency stop:
##    1. Park the toolhead near the middle of the gantry.
##    2. Run  G28 X  and watch.
##         - stops immediately, having barely moved  -> too sensitive, RAISE
##           driver_SGT by 1-2 and retry.
##         - reaches the rail and grinds              -> too insensitive, LOWER
##           driver_SGT by 1-2 and retry.
##    3. Repeat for Y with  G28 Y .
##    4. You want the lowest value that still reaches the rail reliably, then
##       add about 1 for margin. Re-test from several starting positions.
##
##  Change SGT live without restarting:
##      SET_TMC_FIELD STEPPER=stepper_x FIELD=sgt VALUE=3
##  then write the good value into printer.cfg.
##
##  If you change home_current above, SGT must be re-tuned - StallGuard
##  sensitivity moves with motor current.
