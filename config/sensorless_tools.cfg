#####################################################################
#   Sensorless homing diagnostics
#####################################################################
##  NAMING:  <VERB>_<AXIS>_<THING>  - the axis is in the name, so no AXIS=
##      FIND_X_SGT          sweep thresholds, report every one that reaches the rail
##      VERIFY_X_HOME       repeat-home, report the spread
##      MEASURE_X_RAIL      true rail-to-rail travel vs position_max
##      TEST_X_HOME_RANGE   home from several distances off the rail
##      TUNE_X_MATRIX       sweep accel x threshold, rank by window width
##
##  OPTIONAL PARAMS
##      RUNS=5            repeats (verify / measure)
##      FROM= TO= STEP=   sweep bounds; omit to sweep the driver's whole range
##      SGT_FROM= SGT_TO= same, for the matrix
##      ACCELS="1000 1500"  space separated, no commas
##  Bounds outside what the driver accepts are clamped, not obeyed.
##
##  There is no CURRENT parameter. Homing uses whatever _SENSORLESS_VARS holds,
##  so a run cannot leave the drivers somewhere printer.cfg does not describe.
##  Change it deliberately with SET_HOME_CURRENT, which warns that the existing
##  threshold is then void.
##
##  Driver-agnostic. The two StallGuard generations use different field names
##  and OPPOSITE sensitivity directions, and the script detects which is fitted:
##      StallGuard2  tmc2130/2160/2660/5160  sgt                -64..63  LOWER = more sensitive
##      StallGuard4  tmc2209 sgthrs / tmc2240 sg4_thrs            0..255  HIGHER = more sensitive

##  Why a shell command rather than pure gcode: a macro is rendered to text
##  before it runs, so it cannot branch on a value it measured earlier in the
##  same macro; a failed G28 aborts the whole macro rather than recording "no
##  trigger" and continuing; and real travel is only knowable from raw MCU step
##  counts. The measuring lives in ~/sgt_diag.py.
##
##  DEADLOCK WARNING - do not call the python directly here. RUN_SHELL_COMMAND
##  blocks the calling macro until the command exits, but the script drives the
##  machine by POSTing gcode back to Klipper, which cannot run while blocked
##  inside that macro. sgt_run.sh launches it detached and returns immediately.
[gcode_shell_command sgt_diag]
command: /home/voron24/sgt_run.sh
timeout: 30
verbose: True

[gcode_shell_command sgt_result]
command: /usr/bin/cat /home/voron24/printer_data/logs/sgt_summary.txt
timeout: 20
verbose: True

[gcode_shell_command sgt_log]
command: /usr/bin/tail -n 40 /home/voron24/printer_data/logs/sgt_diag.log
timeout: 20
verbose: True

[gcode_shell_command sgt_stop]
command: /usr/bin/pkill -f sgt_diag.py
timeout: 20
verbose: True


#####################################################################
#   Safety notice
#####################################################################

[gcode_macro _SGT_WARN_VARS]
description: Helper - how long the pre-test countdown runs
variable_countdown: 10
##  Milliseconds per counted number. RESPOND reaches the console instantly but
##  G4 only queues a dwell, so without the M400 the whole countdown prints at
##  once and the machine then sits still for the total.
variable_step_ms: 2000
gcode:

[gcode_macro _SGT_WARN]
description: Helper - safety notice and countdown before anything moves
gcode:
    {% set secs = printer['gcode_macro _SGT_WARN_VARS'].countdown|int %}
    ##  Repeated because a single line scrolls away in a busy console.
    {% for i in range(5) %}
        RESPOND TYPE=error MSG="!! STAND BY THE EMERGENCY STOP !!"
    {% endfor %}
    RESPOND MSG="This drives the toolhead INTO THE RAIL on purpose, repeatedly."
    RESPOND MSG="A threshold that is too insensitive will NOT stop - it grinds"
    RESPOND MSG="until the axis runs out of travel."
    RESPOND MSG="Abort with STOP_SGT_DIAG, or EMERGENCY STOP if it is already"
    RESPOND MSG="into the frame. Clear the bed and check nothing is in the way."
    RESPOND MSG=" "
    {% set step = printer['gcode_macro _SGT_WARN_VARS'].step_ms|int %}
    {% for i in range(secs, 0, -1) %}
        RESPOND TYPE=error MSG="starting in {i}..."
        G4 P{step}
        M400
    {% endfor %}
    RESPOND TYPE=error MSG="RUNNING NOW - machine is moving"

[gcode_macro _Y_PLACEMENT_WARN]
description: Helper - remind that Y must be hand-placed at mid-travel first
gcode:
    ##  Y is never moved automatically: until the first successful home its
    ##  position is unmeasured, and moving an axis you cannot locate is how the
    ##  gantry ends up in a rail. X is exempt - it is homed for real first.
    RESPOND TYPE=error MSG="BEFORE THIS RUNS: the toolhead must sit at the MIDDLE of Y."
    RESPOND TYPE=error MSG="Y is NEVER moved automatically - its position is unknown."
    RESPOND TYPE=error MSG="If it is not centred: E-STOP now, run M84, push it to"
    RESPOND TYPE=error MSG="mid-travel by hand, then start again."


#####################################################################
#   Find a working StallGuard threshold
#####################################################################

[gcode_macro FIND_X_SGT]
description: X - sweep the StallGuard threshold, report every value that reaches the rail
gcode:
    _SGT_WARN
    {% set rng = params.FROM is defined and params.TO is defined %}
    {% set st  = params.STEP|default(1)|int %}
    {% if rng %}RESPOND MSG="FIND_X_SGT: sweeping {params.FROM}..{params.TO} step {st}"{% else %}RESPOND MSG="FIND_X_SGT: sweeping the driver's full range, step {st}"{% endif %}
    {% if rng %}RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="X {params.FROM} {params.TO} {st}"{% else %}RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="X"{% endif %}

[gcode_macro FIND_Y_SGT]
description: Y - sweep the StallGuard threshold, report every value that reaches the rail
gcode:
    _Y_PLACEMENT_WARN
    _SGT_WARN
    {% set rng = params.FROM is defined and params.TO is defined %}
    {% set st  = params.STEP|default(1)|int %}
    {% if rng %}RESPOND MSG="FIND_Y_SGT: sweeping {params.FROM}..{params.TO} step {st}"{% else %}RESPOND MSG="FIND_Y_SGT: sweeping the driver's full range, step {st}"{% endif %}
    RESPOND MSG="  Y drags the WHOLE GANTRY, not just the toolhead. It loads the motor"
    RESPOND MSG="  far harder than X and needs its own value."
    {% if rng %}RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="Y {params.FROM} {params.TO} {st}"{% else %}RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="Y"{% endif %}


#####################################################################
#   Prove it repeats
#####################################################################

[gcode_macro VERIFY_X_HOME]
description: X - home repeatedly and report the spread
gcode:
    _SGT_WARN
    {% set runs = params.RUNS|default(10)|int %}
    {% set sgt  = params.SGT|default('cfg') %}
    RESPOND MSG="VERIFY_X_HOME: {runs} runs at threshold '{sgt}'"
    RESPOND MSG="  one success proves nothing - a FALSE trigger also reports success."
    RESPOND MSG="  The number that matters is SPREAD: under 1mm means a stable origin."
    RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="X --verify {sgt} {runs}"

[gcode_macro VERIFY_Y_HOME]
description: Y - home repeatedly and report the spread
gcode:
    _Y_PLACEMENT_WARN
    _SGT_WARN
    {% set runs = params.RUNS|default(10)|int %}
    {% set sgt  = params.SGT|default('cfg') %}
    RESPOND MSG="VERIFY_Y_HOME: {runs} runs at threshold '{sgt}'"
    RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="Y --verify {sgt} {runs}"


#####################################################################
#   Measure the axis
#####################################################################

[gcode_macro MEASURE_X_RAIL]
description: X - measure true rail-to-rail travel against position_max
gcode:
    _SGT_WARN
    {% set runs = params.RUNS|default(10)|int %}
    {% set s = printer.configfile.settings['stepper_x'] %}
    RESPOND MSG="MEASURE_X_RAIL: config claims {s.position_max - s.position_min}mm of travel"
    RESPOND MSG="  Measured SHORTER than configured = the head hits the far rail before"
    RESPOND MSG="  position_min, so position_max claims travel you do not have."
    RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="X --measure {runs}"

[gcode_macro MEASURE_Y_RAIL]
description: Y - measure true rail-to-rail travel against position_max
gcode:
    _Y_PLACEMENT_WARN
    _SGT_WARN
    {% set runs = params.RUNS|default(10)|int %}
    {% set s = printer.configfile.settings['stepper_y'] %}
    RESPOND MSG="MEASURE_Y_RAIL: config claims {s.position_max - s.position_min}mm of travel"
    RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="Y --measure {runs}"


#####################################################################
#   Home from everywhere
#####################################################################

[gcode_macro TEST_X_HOME_RANGE]
description: X - home from 5, 15, 40, 120 and 250mm off the rail
gcode:
    _SGT_WARN
    RESPOND MSG="TEST_X_HOME_RANGE: homing from 5, 15, 40, 120, 250mm off the rail"
    RESPOND MSG="  a home that only works from mid-travel is not good enough. Close to"
    RESPOND MSG="  the rail StallGuard may still be loaded from the previous touch."
    RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="X --range 5 15 40 120 250"

[gcode_macro TEST_Y_HOME_RANGE]
description: Y - home from 5, 15, 40, 120 and 250mm off the rail
gcode:
    _Y_PLACEMENT_WARN
    _SGT_WARN
    RESPOND MSG="TEST_Y_HOME_RANGE: homing from 5, 15, 40, 120, 250mm off the rail"
    RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="Y --range 5 15 40 120 250"


#####################################################################
#   Sweep accel and threshold together
#####################################################################
##  A working threshold is not the same as a GOOD one: a window one integer
##  wide passes cold and fails warm. This ranks combinations by how WIDE the
##  working window is, then re-tests the best few for repeatability, because a
##  wide window that wanders is still unusable.
##
##  homing_speed is NOT swept - it is a config option with no runtime command,
##  so sweeping it would mean rewriting printer.cfg and restarting the firmware
##  mid-run. On failure the report names the speeds to try instead.
##
##  Long running. Narrow it with ACCELS=, stop it with STOP_SGT_DIAG.

[gcode_macro TUNE_Y_MATRIX]
description: Y - sweep accel x threshold, rank by window width then repeatability
gcode:
    _Y_PLACEMENT_WARN
    _SGT_WARN
    {% set ac = params.ACCELS|default('1000 1500') %}
    {% set sgt = params.SGT_FROM is defined and params.SGT_TO is defined %}
    RESPOND MSG="TUNE_Y_MATRIX: accels [{ac}]"
    RESPOND MSG="  homing_speed is NOT swept - it is config-only."
    RESPOND MSG="  To try another, edit it, restart, and re-run."
    {% if sgt %}
        RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="Y --matrix --accels {ac} --sgt {params.SGT_FROM} {params.SGT_TO}"
    {% else %}
        RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="Y --matrix --accels {ac}"
    {% endif %}

[gcode_macro TUNE_X_MATRIX]
description: X - sweep accel x threshold, rank by window width then repeatability
gcode:
    _SGT_WARN
    {% set ac = params.ACCELS|default('1000 1500') %}
    {% set sgt = params.SGT_FROM is defined and params.SGT_TO is defined %}
    RESPOND MSG="TUNE_X_MATRIX: accels [{ac}]"
    RESPOND MSG="  homing_speed is NOT swept - it is config-only."
    RESPOND MSG="  To try another, edit it, restart, and re-run."
    {% if sgt %}
        RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="X --matrix --accels {ac} --sgt {params.SGT_FROM} {params.SGT_TO}"
    {% else %}
        RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="X --matrix --accels {ac}"
    {% endif %}


#####################################################################
#   Homing current
#####################################################################
##  StallGuard infers load from back-EMF, which scales with MOTOR CURRENT and
##  with SPEED. The threshold is tuned against both - change either and it must
##  be re-found.
##
##  home_current 0 means "home at the configured run/hold current". Any other
##  value overrides them for the homing move only, and is restored afterwards.

[gcode_macro SET_HOME_CURRENT]
description: Change the sensorless homing current. SET_HOME_CURRENT CURRENT=0.7
gcode:
    {% set cur = params.CURRENT|float %}
    {% set run = printer.configfile.settings['tmc5160 stepper_x'].run_current|float %}
    {% if cur <= 0.1 or cur > run * 1.5 %}
        { action_raise_error("CURRENT out of sensible range - run_current is %.2fA" % run) }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_SENSORLESS_VARS VARIABLE=home_current VALUE={cur}
    RESPOND MSG="home_current -> {cur}A   (run_current unchanged at {run}A)"
    RESPOND TYPE=error MSG="RE-TUNE REQUIRED: StallGuard scales with current, so the"
    RESPOND TYPE=error MSG="existing threshold is no longer valid. Run FIND_X_SGT / FIND_Y_SGT."
    RESPOND MSG="Runtime only - edit variable_home_current in sensorless.cfg to persist."

[gcode_macro SHOW_HOME_CURRENT]
description: Show homing vs run current, and what each one affects
gcode:
    {% set v = printer['gcode_macro _SENSORLESS_VARS'] %}
    {% set cs = printer.configfile.settings %}
    RESPOND MSG="home_current = {v.home_current}A - used ONLY during G28. StallGuard sees this."
    RESPOND MSG="run_current  = {cs['tmc5160 stepper_x'].run_current}A X / {cs['tmc5160 stepper_y'].run_current}A Y - used for printing."
    RESPOND MSG="  raising run_current does NOT invalidate the StallGuard tuning"
    RESPOND MSG="  changing home_current DOES - re-run FIND_X_SGT / FIND_Y_SGT"

[gcode_macro RESET_CURRENTS]
description: Put run/hold current back to exactly what printer.cfg says
gcode:
    ##  An aborted home can leave the drivers at the reduced homing current.
    ##  The homing macro corrects that itself, but only on the NEXT home - this
    ##  restores them immediately, without moving anything.
    {% set c = printer.configfile.settings %}
    {% for st in ['stepper_x','stepper_y'] %}
        SET_TMC_CURRENT STEPPER={st} CURRENT={c['tmc5160 ' ~ st].run_current} HOLDCURRENT={c['tmc5160 ' ~ st].hold_current}
        RESPOND MSG="{st}: run {c['tmc5160 ' ~ st].run_current}A hold {c['tmc5160 ' ~ st].hold_current}A"
    {% endfor %}


#####################################################################
#   Settings overview and live output
#####################################################################

[gcode_macro SENSORLESS_STATUS]
description: Show sensorless settings for both axes and check the rules that must hold
gcode:
    {% set sx = printer.configfile.settings['stepper_x'] %}
    {% set sy = printer.configfile.settings['stepper_y'] %}
    {% set v  = printer['gcode_macro _SENSORLESS_VARS'] %}
    ##  Resolve the driver section rather than assuming tmc5160.
    {% set cs = printer.configfile.settings %}
    {% set nx = namespace(k=None) %}
    {% set ny = namespace(k=None) %}
    {% for d in ['tmc2130','tmc2209','tmc2240','tmc2660','tmc5160'] %}
        {% if d ~ ' stepper_x' in cs %}{% set nx.k = d ~ ' stepper_x' %}{% endif %}
        {% if d ~ ' stepper_y' in cs %}{% set ny.k = d ~ ' stepper_y' %}{% endif %}
    {% endfor %}
    {% set tx = cs[nx.k] %}
    {% set ty = cs[ny.k] %}
    {% set fx = 'driver_sgthrs' if 'driver_sgthrs' in tx else ('driver_sg4_thrs' if tx.get('driver_sg4_thrs') else 'driver_sgt') %}
    RESPOND MSG="driver {nx.k.split()[0]}   threshold field {fx}"
    RESPOND MSG="  X: {fx}={tx[fx]}  coolstep={tx.coolstep_threshold}  homing_speed={sx.homing_speed}"
    RESPOND MSG="  Y: {fx}={ty[fx]}  coolstep={ty.coolstep_threshold}  homing_speed={sy.homing_speed}"
    RESPOND MSG="  home_current={v.home_current}A  run_current={tx.run_current}A  rotation_distance={sx.rotation_distance}"
    RESPOND MSG="rules that must hold, or NO threshold will ever work:"
    {% if sx.homing_speed <= sx.rotation_distance %}
        RESPOND TYPE=error MSG="  X homing_speed {sx.homing_speed} is NOT above rotation_distance {sx.rotation_distance}"
    {% else %}
        RESPOND MSG="  ok: X homing_speed {sx.homing_speed} exceeds rotation_distance {sx.rotation_distance}"
    {% endif %}
    {% if sy.homing_speed <= sy.rotation_distance %}
        RESPOND TYPE=error MSG="  Y homing_speed {sy.homing_speed} is NOT above rotation_distance {sy.rotation_distance}"
    {% else %}
        RESPOND MSG="  ok: Y homing_speed {sy.homing_speed} exceeds rotation_distance {sy.rotation_distance}"
    {% endif %}
    {% if tx.coolstep_threshold >= sx.homing_speed %}
        RESPOND TYPE=error MSG="  X coolstep {tx.coolstep_threshold} must be BELOW homing_speed {sx.homing_speed}"
    {% else %}
        RESPOND MSG="  ok: X coolstep {tx.coolstep_threshold} sits below homing_speed {sx.homing_speed}"
    {% endif %}
    {% if ty.coolstep_threshold >= sy.homing_speed %}
        RESPOND TYPE=error MSG="  Y coolstep {ty.coolstep_threshold} must be BELOW homing_speed {sy.homing_speed}"
    {% else %}
        RESPOND MSG="  ok: Y coolstep {ty.coolstep_threshold} sits below homing_speed {sy.homing_speed}"
    {% endif %}

[gcode_macro SHOW_SGT_LOG]
description: Show the latest output from a running or finished diagnostic
gcode:
    RUN_SHELL_COMMAND CMD=sgt_log

[gcode_macro SHOW_SGT_RESULT]
description: Re-print the summary from the last diagnostic, without re-running it
gcode:
    RUN_SHELL_COMMAND CMD=sgt_result

[gcode_macro STOP_SGT_DIAG]
description: Abort a running diagnostic and release the motors
gcode:
    RUN_SHELL_COMMAND CMD=sgt_stop
    M84
    RESPOND MSG=diagnostic stopped, motors released

#####################################################################
#   Which runway strategy does this axis actually need?
#####################################################################
##  StallGuard only reads a valid load once the axis is at STEADY VELOCITY.
##  Start a home too close to the rail and it arrives while still accelerating,
##  so it trips early - which is why an axis can home perfectly from mid-travel
##  and be several mm out from 5mm away. That matters in normal use because
##  after every home the head sits `backoff` mm from the rail.
##
##  Two ways to give it runway:
##    unload_dist       blind G1 backoff before homing. NOT monitored - Klipper
##                      watches the StallGuard pin only during a homing move, so
##                      this runs to completion whatever it hits, computed from
##                      a position that may be wrong after a false trigger.
##    second_home_dist  home, back off, home again. The homes stop on contact,
##                      but the BACKOFF BETWEEN THEM does not - it is a plain G1
##                      on the same belief. Safe only while triggers are
##                      trustworthy, which is exactly when you do not need it.
##                      Defaults to 0. See Corrections in the README.
##
##  This runs the home-range test under all four combinations and reports which
##  your axis needs. It restores your settings afterwards, including on failure.

[gcode_macro COMPARE_X_HOMING]
description: X - measure neither / unload / second home / both, and report which works
gcode:
    _SGT_WARN
    {% set sec = params.SECOND|default(40)|float %}
    {% set unl = params.UNLOAD|default(40)|float %}
    RESPOND MSG="COMPARE_X_HOMING: second_home={sec}mm vs unload={unl}mm"
    RESPOND MSG="  4 combinations x 5 distances - allow ten minutes."
    RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="X --compare {sec} {unl}"

[gcode_macro COMPARE_Y_HOMING]
description: Y - measure neither / unload / second home / both, and report which works
gcode:
    _Y_PLACEMENT_WARN
    _SGT_WARN
    {% set sec = params.SECOND|default(40)|float %}
    {% set unl = params.UNLOAD|default(40)|float %}
    RESPOND MSG="COMPARE_Y_HOMING: second_home={sec}mm vs unload={unl}mm"
    RESPOND MSG="  4 combinations x 5 distances - allow ten minutes."
    RUN_SHELL_COMMAND CMD=sgt_diag PARAMS="Y --compare {sec} {unl}"
